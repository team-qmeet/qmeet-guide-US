<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qmeet · Guide 2 · Courseware</title>
<style>
  :root{--teal:#10c9a8;--teal-d:#0bb398;--teal-ink:#04221d;--ink:#1a1a1a;--label:#374151;--ph:#9ca3af;--border:#e5e7eb;--side0:#0a302a;--side1:#0c3e35}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;background:#06120f;color:#fff;display:flex;min-height:100vh;overflow:hidden}

  /* SIDEBAR */
  .sidebar{width:clamp(208px,19vw,288px);flex-shrink:0;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--side1),var(--side0));border-right:1px solid rgba(255,255,255,.06);padding:22px 16px}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .sb-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#16d2a8,#10b495);display:grid;place-items:center;font-weight:900;color:var(--teal-ink);box-shadow:0 6px 16px rgba(16,201,168,.45)}
  .sb-brand .t{font-weight:800;font-size:16px;letter-spacing:-.01em}
  .sb-brand .t small{display:block;font-size:11px;font-weight:600;color:#7fcab8;margin-top:1px}
  .modenav{display:flex;gap:5px;background:rgba(255,255,255,.07);border-radius:12px;padding:4px;margin:0 2px 4px}
  .modenav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border:none;border-radius:9px;
    background:transparent;color:#a9d6ca;font-size:12.5px;font-weight:800;cursor:pointer;transition:.18s;font-family:inherit}
  .modenav button .mi{font-size:13px}
  .modenav button:hover{background:rgba(255,255,255,.07);color:#dff3ed}
  .modenav button.on{background:linear-gradient(135deg,#16d2a8,#0fbb99);color:#04221d;box-shadow:0 5px 14px rgba(16,201,168,.35)}
  .sb-cap{font-size:11px;font-weight:700;letter-spacing:.14em;color:#5f9c8c;padding:8px 10px 6px}
  .menu{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
  .mitem{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;cursor:pointer;transition:background .2s;position:relative}
  .mitem:hover{background:rgba(255,255,255,.05)}
  .mitem .no{width:26px;height:26px;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px;font-weight:800;color:#bfe9df}
  .mitem .tx{min-width:0}
  .mitem .tx .l{font-size:13.5px;font-weight:700;color:#dff3ed;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mitem .tx .s{font-size:11px;color:#7fb6a8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mitem.active{background:linear-gradient(135deg,rgba(16,201,168,.22),rgba(16,201,168,.10))}
  .mitem.active:before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--teal)}
  .mitem.active .no{background:linear-gradient(135deg,#16d2a8,#10b495);color:var(--teal-ink)}
  .mitem.active .tx .l{color:#fff}
  .mgrp{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;cursor:pointer;transition:.18s;
    font-size:13.5px;font-weight:800;color:#cfeae2;margin-top:3px}
  .mgrp:hover{background:rgba(255,255,255,.06)}
  .mgrp .gn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mgrp .gc{font-size:10.5px;font-weight:800;color:#7fb6a8;background:rgba(255,255,255,.09);padding:2px 8px;border-radius:999px}
  .mgrp .gv{display:grid;place-items:center;color:#7fb6a8;transition:transform .22s}
  .mgrp .gv svg{width:15px;height:15px}
  .mgrp.open{background:rgba(255,255,255,.07);color:#fff}
  .mgrp.open .gv{transform:rotate(180deg)}
  .mgrp.act{background:linear-gradient(135deg,rgba(16,201,168,.26),rgba(16,201,168,.10));color:#fff}
  .mgrp.done .gn{color:#8fc9bc}
  .mitem.sub{margin-left:10px;padding:9px 10px}
  .mitem.sub .no{width:23px;height:23px;font-size:11px}
  .mitem.sub .tx .l{font-size:12.5px}
  .mitem.sub .tx .s{font-size:10.5px}
  .mitem.active:before{left:-10px}
  .mitem.done .no{background:rgba(16,201,168,.25);color:#9af5dd;font-size:0}
  .mitem.done .no:after{content:"✓";font-size:13px}
  .sb-foot{padding:12px 10px 2px;font-size:11px;color:#5f9c8c;border-top:1px solid rgba(255,255,255,.06);margin-top:8px}

  /* VIEWPORT */
  .viewport{flex:1;position:relative;display:flex;flex-direction:column;background:radial-gradient(120% 120% at 80% 0%,#0e3a44 0%,rgba(14,58,68,0) 50%),radial-gradient(120% 120% at 10% 100%,#0c3f37 0%,rgba(12,63,55,0) 55%),linear-gradient(135deg,#08221f,#0a2e2a 60%,#0d3f3a)}
  .topbar{height:6px;background:rgba(255,255,255,.08);flex-shrink:0}
  .topbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16d2a8,#9af5dd);transition:width .3s}
  .vp-head{display:flex;align-items:center;gap:12px;padding:16px 30px 4px}
  .vp-head .chip{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--teal-ink);background:#9af5dd;padding:5px 12px;border-radius:999px}
  .vp-head .h{font-size:clamp(17px,1.7vw,26px);font-weight:900;letter-spacing:-.02em}

  .stageArea{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 20px}
  .winScale{position:absolute;transform-origin:center center}
  .window{width:1000px;height:680px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 50px 110px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;opacity:0;transform:translateY(26px) scale(.985);animation:winIn .9s cubic-bezier(.22,1,.36,1) .1s forwards}
  @keyframes winIn{to{opacity:1;transform:none}}
  .titlebar{height:42px;background:#dfe1e5;display:flex;align-items:center;padding:0 14px;gap:14px;flex-shrink:0}
  .lights{display:flex;gap:8px}.lights span{width:12px;height:12px;border-radius:50%}
  .lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
  .tab{display:flex;align-items:center;gap:8px;background:#f6f7f8;height:30px;padding:0 12px;border-radius:8px 8px 0 0;margin-bottom:-6px;font-size:13px;color:#3c4043;max-width:210px}
  .tab .q{font-weight:900;color:var(--teal);font-size:14px}.tab .x{margin-left:auto;color:#9aa0a6}
  .toolbar{height:46px;background:#edeef0;display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;border-bottom:1px solid #d8dadd}
  .navbtns{display:flex;gap:14px;color:#5f6368;font-size:18px}.navbtns span:nth-child(2){color:#9aa0a6}
  .urlbar{flex:1;height:30px;background:#fff;border-radius:16px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13.5px;color:#3c4043;border:1px solid #e1e3e6}
  .urlbar .lock{color:#9aa0a6;font-size:12px}
  .toolbar .right{display:flex;gap:13px;color:#5f6368;font-size:15px}
  .page{flex:1;position:relative;overflow:hidden;background:#fff}
  #screen{position:absolute;inset:0}
  .cursor{position:absolute;width:24px;height:24px;left:0;top:0;z-index:80;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));opacity:0;transition:opacity .3s}
  /* click target highlight */
  .clickme{position:relative;z-index:45;outline:3px solid #16d2a8;outline-offset:3px;border-radius:10px;animation:clickPulse 1.15s ease-out infinite}
  @keyframes clickPulse{0%{box-shadow:0 0 0 0 rgba(16,201,168,.6),0 0 22px rgba(16,201,168,.55)}70%{box-shadow:0 0 0 16px rgba(16,201,168,0),0 0 22px rgba(16,201,168,.3)}100%{box-shadow:0 0 0 0 rgba(16,201,168,0),0 0 22px rgba(16,201,168,.55)}}
  .clickring{position:absolute;pointer-events:none;z-index:44;border-radius:12px;border:2px solid rgba(16,201,168,.9);opacity:0}
  .clickring.go{animation:ringOut .9s ease-out}
  @keyframes ringOut{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

  .caption{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:40;width:74%;max-width:860px;text-align:center;pointer-events:none}
  .caption .cap{display:inline-block;background:rgba(3,20,17,.78);backdrop-filter:blur(8px);padding:11px 20px;border-radius:13px;font-size:clamp(13px,1.55vw,20px);font-weight:700;line-height:1.45;color:#f3fffb;border:1px solid rgba(154,245,221,.2);box-shadow:0 14px 32px rgba(0,0,0,.4);opacity:0;transform:translateY(10px)}
  .caption .cap.show{animation:capIn .45s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes capIn{to{opacity:1;transform:none}}

  /* 재생 타임라인 */
  .timeline{flex-shrink:0;padding:10px 30px 0;position:relative;z-index:55}
  .tlbar{position:relative;height:6px;border-radius:4px;background:rgba(255,255,255,.16);cursor:pointer;transition:height .15s}
  .timeline:hover .tlbar{height:9px}
  .tlfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#16d2a8,#9af5dd);width:0;will-change:width}
  .tlsegs{position:absolute;inset:0;pointer-events:none}
  .tlsegs i{position:absolute;top:0;bottom:0;width:2px;background:rgba(6,25,21,.55)}
  .tlhead{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);left:0;pointer-events:none;will-change:left}
  .timeline:hover .tlhead{transform:translate(-50%,-50%) scale(1.15)}
  .tltip{position:absolute;top:-24px;transform:translateX(-50%);background:rgba(3,20,17,.92);color:#eafff8;font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
  .tltip.show{opacity:1}
  .tltimes{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8fc9bc;font-weight:600;margin-top:6px;gap:12px}
  #tlLabel{color:#bfe9df;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tltip b{color:#9af5dd;margin-right:5px}
  .controls{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:4px 30px 18px;z-index:50}
  .controls button{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#eafff8;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .controls button:hover{background:rgba(255,255,255,.22)}
  .controls button.main{width:48px;height:48px;background:linear-gradient(135deg,#16d2a8,#10b495);color:var(--teal-ink);border:none;box-shadow:0 8px 22px rgba(16,201,168,.5)}
  .controls svg{width:18px;height:18px;fill:currentColor}
  .controls .lbl{font-size:13px;font-weight:700;color:#cdeee6}.controls .sp{flex:1}
  .controls .speed{display:flex;align-items:center;gap:6px;font-size:12px;color:#bfe9df;font-weight:600}
  .controls select{background:rgba(255,255,255,.10);color:#eafff8;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:3px 7px;font-family:inherit}

  /* ===== PAGE DESIGN (1000x594) ===== */
  .pg{position:absolute;inset:0;color:#222;font-size:15px}
  .pg-app{position:absolute;inset:0;background:linear-gradient(160deg,#eef8f4,#e1f1ec)}
  .pg-white{position:absolute;inset:0;background:#fff}
  .anim{animation:popUp .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes popUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .fadein{animation:fade .5s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* right rail */
  .rail{position:absolute;top:0;right:0;bottom:0;width:42px;background:#fafcfb;border-left:1px solid #eef2f1;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:16px;z-index:2;color:#9fb1ab;font-size:15px}
  .rail span{opacity:.8}

  /* login */
  .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);width:360px}
  .lg .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .lg h1{font-size:20px;font-weight:800;color:#1a1a1a}
  .lg .lang{border:1.5px solid var(--teal);color:var(--teal-d);background:#ecfdf8;font-size:12.5px;font-weight:700;border-radius:16px;padding:6px 12px}
  .fld{margin-bottom:15px}.fld label{display:block;font-size:14px;font-weight:700;color:var(--label);margin-bottom:8px}
  .inp{height:46px;border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;padding:0 16px;font-size:14.5px;color:#1a1a1a;background:#fff;transition:border-color .2s,box-shadow .2s}
  .inp.focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(16,201,168,.16)}
  .inp .pl{color:var(--ph)}.inp .dots{letter-spacing:3px}
  .caret{width:1.5px;height:19px;background:#1a1a1a;margin-left:1px;opacity:0;animation:blink 1s step-end infinite}
  .inp.focus .caret{opacity:1}@keyframes blink{50%{opacity:0}}
  .gbtn{margin-top:22px;height:50px;border-radius:13px;background:var(--teal);color:#fff;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:transform .12s,background .2s}
  .gbtn.press{transform:scale(.97);background:var(--teal-d)}
  .success{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none}
  .success.show{animation:succIn .5s ease forwards}@keyframes succIn{to{opacity:1}}
  .cwrap{width:92px;height:92px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 14px 34px rgba(16,201,168,.4);transform:scale(0)}
  .success.show .cwrap{animation:pop .55s cubic-bezier(.18,1.5,.4,1) .1s forwards}@keyframes pop{to{transform:scale(1)}}
  .cwrap svg{width:48px;height:48px}.cwrap path{stroke:#fff;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
  .success.show .cwrap path{animation:draw .45s ease .42s forwards}@keyframes draw{to{stroke-dashoffset:0}}
  .success .msg{font-size:21px;font-weight:800;color:#1a1a1a;opacity:0}.success.show .msg{animation:popUp .5s ease .55s forwards}
  .success .sub2{font-size:14px;color:#6b7280;opacity:0}.success.show .sub2{animation:popUp .5s ease .68s forwards}

  /* app header */
  .ah{position:absolute;top:0;left:0;right:42px;height:58px;display:flex;align-items:center;padding:0 26px;background:#fff;border-bottom:1px solid #eef2f1;z-index:3}
  .ah .bk{font-size:22px;color:#778681;margin-right:10px}
  .ah .ttl{font-size:18px;font-weight:800;color:#21302d}
  .ah .ctr{flex:1;text-align:center;font-size:18px;font-weight:800;color:#21302d}
  .ah .r{display:flex;align-items:center;gap:9px}
  .pill{font-size:13px;font-weight:700;color:#3c6a5e;background:#e4f3ee;padding:7px 15px;border-radius:999px}
  .gpill{font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1fc9a6,#12b08f);padding:9px 18px;border-radius:999px;box-shadow:0 8px 18px rgba(27,180,147,.32);transition:.2s}
  .gpill.hot{outline:4px solid rgba(154,245,221,.9);outline-offset:3px}
  .daterow{position:absolute;top:62px;left:0;right:42px;text-align:center;font-size:13px;color:#7c918c}
  .sect{position:absolute;left:30px;top:88px;font-size:17px;font-weight:800;color:#2a3a37}
  .grid{position:absolute;left:30px;right:56px;display:grid;gap:16px}
  .grid.t-class{top:74px;grid-template-columns:repeat(4,1fr)}
  .grid.t-act4{top:120px;grid-template-columns:repeat(4,1fr)}
  .grid.t-act3{top:120px;grid-template-columns:repeat(3,1fr)}
  .ccard{border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 10px 24px rgba(20,60,52,.10)}
  .cthumb{height:116px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
  .cthumb:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 62%)}
  .cthumb .cl,.cthumb .ct{position:relative;z-index:2;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .cthumb .cl{font-size:11px;font-weight:700;opacity:.9}.cthumb .ct{font-size:17px;font-weight:900;line-height:1.12;margin-top:2px}
  .cfoot{display:flex;justify-content:space-between;padding:9px 12px;font-size:11.5px;color:#94a7a2}
  .acard{background:#fff;border-radius:14px;box-shadow:0 8px 20px rgba(20,60,52,.09);padding:13px;display:flex;flex-direction:column;min-height:152px}
  .achip{align-self:flex-start;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px}
  .achip.s{background:#e3f5ec;color:#1f9c6e}.achip.a{background:#fdf1d8;color:#c98a14}.achip.p{background:#efe6fb;color:#7b4fd0}
  .atitle{font-size:15px;font-weight:800;color:#26332f;margin:9px 2px 0;line-height:1.25}
  .abody{flex:1;margin-top:10px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .abody.s{background:#eafaf1}.abody.a{background:#fef8ea}.abody.p{background:#f4eefc}
  .abody .ic{font-size:27px}.abody .w{font-size:12.5px;font-weight:700;color:#7d918c}
  .afoot{font-size:11.5px;color:#9bada8;margin-top:9px}
  .bnav{position:absolute;left:0;right:42px;bottom:0;height:54px;background:#fff;border-top:1px solid #eef3f1;display:flex;align-items:center;justify-content:center;gap:150px;font-size:12px;font-weight:700;color:#9bada8;z-index:3}
  .bnavc{position:absolute;left:calc(50% - 21px);bottom:28px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#16d2a8,#10b495);box-shadow:0 10px 24px rgba(16,201,168,.45);display:grid;place-items:center;color:#fff;font-size:21px;z-index:4}

  .topctrl{position:absolute;top:18px;right:58px;display:flex;align-items:center;gap:12px;z-index:6}
  .ddpill{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#3a4a47;background:#fff;border:1px solid #e7eeeb;padding:9px 18px;border-radius:999px;box-shadow:0 4px 12px rgba(20,60,52,.08)}
  .ddpill .cv{color:#9bada8}
  .clabel{position:absolute;top:74px;left:30px;font-size:16px;font-weight:800;color:#2a3a37}
  .scrollwrap{position:absolute;left:0;right:42px;bottom:0;overflow-y:auto}
  .gridS{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 30px 22px}

  /* invite code popover (top-right) */
  .codepop{position:absolute;top:60px;right:58px;width:300px;background:#fff;border-radius:14px;box-shadow:0 22px 54px rgba(0,0,0,.24);border:1px solid #eef2f1;padding:18px;opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:.28s;z-index:9}
  .codepop:before{content:"";position:absolute;top:-8px;right:34px;width:16px;height:16px;background:#fff;border-left:1px solid #eef2f1;border-top:1px solid #eef2f1;transform:rotate(45deg)}
  .codepop.show{opacity:1;transform:none;pointer-events:auto}
  .codepop .cpt{font-size:16px;font-weight:900;color:#21302d}
  .codepop .cps{font-size:12px;color:#86968f;margin-top:5px;line-height:1.4}
  .codes{display:flex;justify-content:space-between;gap:7px;margin:16px 0 14px}
  .codes b{width:36px;height:46px;border:1.5px solid #d6e3df;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#2a3a37;transition:.2s}
  .codes b.fill{border-color:var(--teal);background:#ecfdf8;color:#0bb398}
  .codepop .gbtn{margin-top:0;height:44px}

  /* two-pane */
  .pane{position:absolute;top:58px;left:0;right:42px;bottom:0;display:flex;gap:18px;padding:18px 24px}
  .col{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-y:auto;padding-right:4px}
  .panel{flex:1;border:2px solid var(--teal);border-radius:16px;background:#fff;padding:15px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .pbody{flex:1;overflow-y:auto;padding-right:5px}
  .infobox{border:1px solid #e6efeb;border-radius:12px;padding:12px 14px}

window.addEventListener('resize',fit);
class Abort{}
function wait(realMs,g){
  return new Promise((res,rej)=>{
    const o={rem:realMs,start:0,t:null,
      fire(){if(o.t){clearTimeout(o.t);o.t=null;}timers.delete(o);g===gen?res():rej(new Abort());},
      arm(){if(o.t)return;o.start=Date.now();o.t=setTimeout(o.fire,o.rem);},
      hold(){if(o.t){clearTimeout(o.t);o.t=null;o.rem=Math.max(0,o.rem-(Date.now()-o.start));}}
    };
    timers.add(o);
    if(!paused) o.arm();
  });
}
const sleep=(ms,g)=>wait(ms/SPEED,g);
function guard(g){if(g!==gen)throw new Abort();}
function holdTimers(){[...timers].forEach(o=>o.hold());}

async function move(el,g,dur=750,bx=0.5,by=0.5){if(!el)return;const p=page.getBoundingClientRect(),r=el.getBoundingClientRect();

  el.appendChild(rp);try{if(rp.animate)rp.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:.6},{transform:'translate(-50%,-50%) scale(1.1)',opacity:0}],{duration:520,easing:'ease-out'});}catch(e){}

  if(!el)return;

  const from=el.scrollLeft, delta=max-from; if(Math.abs(delta)<3)return;
  const steps=Math.max(8,Math.round((dur/SPEED)/16));

async function scrollToEl(container,el,g,dur=1400){
  if(!container||!el)return;

}

  let out=capsIn(sec.run.toString());
  if(!out.length){ // 공용 헬퍼로 위임한 경우 한 단계 따라가기

}
