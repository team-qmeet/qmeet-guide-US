<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qmeet · Complete Product Guide</title><style>
*{box-sizing:border-box}body{margin:0;background:#062c25;color:#fff;font-family:'Avenir Next',Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}header{background:#f0fff7;color:#103f32;padding:18px 26px 15px;flex-shrink:0;border-bottom:1px solid #8db8a4;box-shadow:0 8px 22px #001b2540;z-index:5}.top{display:flex;align-items:center;gap:30px}.brand{font-size:26px;font-weight:850;letter-spacing:-1px;min-width:104px}.selectors{display:flex;align-items:center;gap:30px;flex:1}.group{display:flex;align-items:center;gap:10px}.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#497466;margin-right:2px}button{border:1px solid #87b39f;color:#164e3d;background:#fff;border-radius:8px;padding:13px 19px;cursor:pointer;font:750 15px/1.3 'Avenir Next',Arial,sans-serif;transition:background .2s,transform .2s,box-shadow .2s}button:hover{background:#d6f4e4;transform:translateY(-2px)}button[aria-pressed=true]{background:#056b50;color:#fff;border-color:#056b50;box-shadow:0 3px 9px #056b5020}button:focus-visible{outline:3px solid #08a270;outline-offset:4px}.hint{margin-top:13px;display:flex;align-items:center;gap:13px;font-size:14px;line-height:1.4;color:#285b46}.hint strong{color:#006b50}.signal{width:29px;height:29px;background:#cfefdf;border-radius:6px;display:grid;place-items:center;color:#006b50;font-size:20px;font-weight:800;animation:point 1.4s ease-in-out 4}.guide-area{flex:1;position:relative;min-height:0;overflow:hidden}.guide-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#062c25}.guide-frame.active{display:block;animation:enter .38s ease-out}.attention-product{animation:glow 1.4s 3}.attention-role{animation:glow 1.4s 4.2s 3}.chosen .attention-product,.chosen .attention-role,.chosen .signal{animation:none}.status{margin-left:auto;font-size:12px;color:#497466;white-space:nowrap}@keyframes point{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}@keyframes glow{0%,100%{box-shadow:0 0 0 0 #00806000}50%{box-shadow:0 0 0 5px #00806038;transform:translateY(-2px)}}@keyframes enter{from{opacity:.35;transform:translateX(16px)}to{opacity:1;transform:none}}@media(max-width:1050px){.top{gap:15px}.selectors{gap:16px}.label{display:none}button{padding:11px 13px;font-size:13px}.brand{min-width:auto}.status{display:none}}@media(max-width:680px){header{padding:12px}.top{align-items:flex-start}.brand{font-size:23px;margin-top:8px}.selectors{flex-direction:column;align-items:stretch;gap:8px}.group{gap:7px}.group button{flex:1;font-size:12px;padding:10px 9px}.hint{font-size:12px;gap:8px;margin-top:10px}.hint .signal{flex-shrink:0}button .long{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.feature-label{font-size:19px;font-weight:800;color:#174d3d;white-space:nowrap}header{padding:15px 24px}.top{gap:26px}.selectors{flex:initial}.group{gap:10px}@media(max-width:680px){.top{flex-direction:column;gap:10px}.feature-label{font-size:16px}.selectors{width:100%}.group{width:100%}header{padding:12px 16px}}
</style></head><body><header id="header"><div class="top"><div class="feature-label">Main Features</div><div class="selectors"><div class="group" aria-label="Choose a main feature"><button id="p1" aria-pressed="true" onclick="selectProduct(1)">Activity Snapshots</button><button id="p2" class="attention-product" aria-pressed="false" onclick="selectProduct(2)">AI Courseware</button></div></div></div></header><main class="guide-area" id="frames" aria-label="Interactive product walkthrough"></main><script>
const documents=[];

let product=1,role='student',pendingPreview=null;const frames={};function applyPreview(f){if(pendingPreview==='growth'){f.contentWindow.goSection(8);pendingPreview=null}}
function update(){for(const n of [1,2])document.getElementById('p'+n).setAttribute('aria-pressed',n===product);}
function loadFrame(n){if(frames[n])return frames[n];const f=document.createElement('iframe');f.className='guide-frame';f.title=(n===1?'Activity Snapshots':'AI Courseware')+' interactive guide';f.id='frame'+n;f.src='guides/guide-'+n+'.html';f.onload=()=>{f.dataset.ready='true';if(n===product){f.contentWindow.switchMode(role);applyPreview(f);update()}else f.contentWindow.pause()};document.getElementById('frames').append(f);frames[n]=f;return f}
function selectProduct(n){if(frames[product]?.dataset.ready)frames[product].contentWindow.pause();product=n;document.getElementById('header').classList.add('chosen');const f=loadFrame(n);Object.entries(frames).forEach(([id,frame])=>frame.classList.toggle('active',Number(id)===n));if(f.dataset.ready)f.contentWindow.switchMode(role);applyPreview(f);update()}
function selectRole(r){role=r;document.getElementById('header').classList.add('chosen');if(frames[product]?.dataset.ready)frames[product].contentWindow.switchMode(r);update()}
window.addEventListener('message',e=>{if(e.data?.type==='qmeet-guide-link'){pendingPreview=e.data.preview;if(pendingPreview)role='teacher';selectProduct(e.data.product);return}if(e.data?.type==='qmeet-guide-role'&&e.data.product===product&&['student','teacher'].includes(e.data.role)){role=e.data.role;document.getElementById('header').classList.add('chosen');update()}});
loadFrame(1).classList.add('active');update();
</script></body></html>
